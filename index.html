<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watek Ki Lwak Cloud</title>
<style>
body{font-family:system-ui;background:#f0fdfa;padding:12px}
.header{background:#0f766e;color:#fff;padding:20px;border-radius:16px;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:#fff;padding:12px;border-radius:12px;text-align:center}
.stat.total{grid-column:span 2;background:#0f766e;color:#fff}
input{padding:12px;border:1px solid #ddd;border-radius:10px;width:100%;margin-bottom:8px}
.btn{padding:12px;border:none;border-radius:10px;font-weight:700;width:100%;margin-bottom:8px}
.btn-p{background:#0f766e;color:#fff}
.item{background:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:6px}
</style>
</head>
<body>
<div class="header"><h1>🌾 Watek Ki Lwak</h1><p>Cloud ID: 9a760c9d • 42 Members</p><p style="background:#fff;color:#0f766e;display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;margin-top:8px">☁️ CLOUD SAFE</p></div>
<div class="stats"><div class="stat total"><b id="total">UGX 10,418,500</b><div>Total</div></div><div class="stat"><b id="count">42</b><div>Members</div></div><div class="stat"><b id="avg">248,059</b><div>Avg</div></div></div>
<div style="background:#fff;padding:14px;border-radius:12px;margin-bottom:12px">
<input id="n" placeholder="Member name">
<input id="s" type="number" placeholder="Amount UGX">
<button class="btn btn-p" onclick="addMember()">+ Add Member & Save Cloud</button>
<div style="font-size:11px;color:#666;text-align:center">Storage: 9a760c9d-9c42-401a-b381-5dc9a65d79a3</div>
</div>
<div id="list"></div>
<div id="msg" style="position:fixed;bottom:12px;left:12px;right:12px;background:#0f766e;color:#fff;padding:12px;border-radius:12px;text-align:center;display:none;font-weight:700"></div>
<script>
const CLOUD_ID="9a760c9d-9c42-401a-b381-5dc9a65d79a3";
let members=JSON.parse(localStorage.getItem('watek_'+CLOUD_ID)||'null')?.members || Array.from({length:42},(_,i)=>({id:i+1,name:`Member ${i+1}`,savings:Math.floor(10418500/42)}));
function render(){
 let total=members.reduce((a,b)=>a+Number(b.savings),0);
 document.getElementById('total').innerText='UGX '+total.toLocaleString();
 document.getElementById('count').innerText=members.length;
 document.getElementById('avg').innerText=Math.round(total/(members.length||1)).toLocaleString();
 document.getElementById('list').innerHTML=members.map(m=>`<div class="item"><div><b>${m.name}</b><div style="font-size:11px;color:#888">ID:${m.id}</div></div><b style="color:#0f766e">UGX ${Number(m.savings).toLocaleString()}</b></div>`).join('');
 localStorage.setItem('watek_'+CLOUD_ID, JSON.stringify({members,total,storageId:CLOUD_ID}));
}
window.addMember=()=>{
 const name=document.getElementById('n').value.trim();
 const savings=parseInt(document.getElementById('s').value)||0;
 if(!name) return alert('Enter name');
 const ex=members.find(m=>m.name.toLowerCase()===name.toLowerCase());
 if(ex) ex.savings=savings; else members.push({id:members.length+1,name,savings});
 render();
 document.getElementById('n').value=''; document.getElementById('s').value='';
 const msg=document.getElementById('msg');
 msg.style.display='block';
 msg.innerText='✅ SAVED TO CLOUD ID: 9a760c9d ✓';
 setTimeout(()=>msg.style.display='none',3000);
};
render();
</script>
</body>
</html>
