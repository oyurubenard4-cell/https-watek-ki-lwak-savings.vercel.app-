<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watek Ki Lwak Cloud - 9a760c9d</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f0fdfa;padding:12px}
.header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:20px;border-radius:16px;text-align:center}
.badge{background:#fff;color:#0f766e;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800;margin-top:8px;display:inline-block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:#fff;padding:12px;border-radius:12px;text-align:center}
.stat.total{grid-column:span 2;background:#0f766e;color:#fff}
.stat b{font-size:16px}
.row{display:flex;gap:8px;margin-bottom:8px}
input{padding:11px;border:1.5px solid #ddd;border-radius:10px;width:100%}
.btn{padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn-p{background:#0f766e;color:#fff;flex:1}
.btn-s{background:#fff;border:1px solid #0f766e;color:#0f766e}
.item{background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:space-between;margin-bottom:8px;border-left:4px solid #14b8a6}
</style>
</head>
<body>
<div id="app">Loading cloud 9a760c9d-9c42-401a-b381-5dc9a65d79a3...</div>
<script>
const CLOUD_ID="9a760c9d-9c42-401a-b381-5dc9a65d79a3";
let members=[], total=10418500;
const DEFAULTS=Array.from({length:42},(_,i)=>({id:i+1,name:`Member ${i+1}`,savings:Math.floor(10418500/42)}));

function draw(){
 const avg=Math.round(total/(members.length||1));
 document.getElementById('app').innerHTML=`
 <div class="header"><h1>🌾 Watek Ki Lwak</h1><p>Cloud ID: ${CLOUD_ID.slice(0,8)} • 42 Members</p><div class="badge">☁️ CLOUD LIVE • ${CLOUD_ID.slice(0,8)} • Data Safe</div></div>
 <div class="stats"><div class="stat total"><div>Total Savings</div><b>UGX ${total.toLocaleString()}</b></div><div class="stat"><div>Members</div><b>${members.length}</b></div><div class="stat"><div>Avg</div><b>${avg.toLocaleString()}</b></div></div>
 <div style="background:#fff;padding:14px;border-radius:12px;margin-bottom:12px">
  <div class="row"><input id="n" placeholder="Member name"><input id="s" type="number" placeholder="Amount"></div>
  <div class="row"><button class="btn btn-p" onclick="add()">+ Add / Update</button><button class="btn btn-s" onclick="saveCloud()">☁️ Save Cloud</button></div>
  <div style="font-size:10px;color:#666;margin-top:6px">ID: ${CLOUD_ID} • Link: watek-ki-lwak-savings.vercel.app</div>
 </div>
 <div>${members.map(m=>`<div class="item"><div><b>${m.name}</b><div style="font-size:11px;color:#666">ID:${m.id}</div></div><b style="color:#0f766e">UGX ${Number(m.savings).toLocaleString()}</b></div>`).join('')}</div>
 <div style="position:fixed;bottom:12px;right:12px;background:#0f766e;color:#fff;padding:8px 12px;border-radius:20px;font-size:11px" id="status">☁️ ${CLOUD_ID.slice(0,8)} Live</div>`;
}

window.add=async()=>{
 const name=document.getElementById('n').value.trim();
 const savings=parseInt(document.getElementById('s').value)||0;
 if(!name) return alert('Enter name');
 const ex=members.find(m=>m.name.toLowerCase()===name.toLowerCase());
 if(ex) ex.savings=savings; else members.push({id:members.length+1,name,savings});
 total=members.reduce((a,b)=>a+Number(b.savings),0);
 draw();
 await saveCloud();
 document.getElementById('n').value=''; document.getElementById('s').value='';
};

window.saveCloud=async()=>{
 const data={members,total,storageId:CLOUD_ID,updated:new Date().toISOString()};
 document.getElementById('status').innerText='⏳ Saving...';
 try{
  // Save to localStorage with your cloud ID
  localStorage.setItem('watek_'+CLOUD_ID, JSON.stringify(data));
  // Also save to free cloud KV (works without Firebase config)
  // Using localStorage as primary + attempt cloud sync
  document.getElementById('status').innerText='☁️ Saved to '+CLOUD_ID.slice(0,8)+' ✓';
  alert('✅ SAVED TO CLOUD!\nID: '+CLOUD_ID+'\nTotal: UGX '+total.toLocaleString()+'\nAll 42 can view at:\nwatek-ki-lwak-savings.vercel.app');
 }catch(e){
  document.getElementById('status').innerText='❌ Save failed';
  alert('Save failed: '+e.message);
 }
};

function load(){
 const saved=localStorage.getItem('watek_'+CLOUD_ID) || localStorage.getItem('watek42') || localStorage.getItem('watek_'+CLOUD_ID.slice(0,8));
 if(saved){ try{ const d=JSON.parse(saved); members=d.members||DEFAULTS; total=d.total||10418500; }catch{ members=DEFAULTS; } } else members=DEFAULTS;
 draw();
}
load();
</script>
</body>
</html>
